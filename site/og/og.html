<!doctype html>

<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>PDF Edit — image de partage</title>
    <link rel="stylesheet" href="../src/assets/site.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: linear-gradient(180deg, #f4f8ff, #ffffff 80%);
      }

      .og-text {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 500px;
      }

      .og-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .og-brand img {
        width: 52px;
        height: 52px;
      }

      .og-text h1 {
        margin-top: 36px;
        font-size: 62px;
        line-height: 1.05;
      }

      .og-sub {
        margin-top: 22px;
        color: #5a6474;
        font-size: 27px;
        line-height: 1.4;
      }

      .og-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 32px 0 0;
        padding: 0;
        list-style: none;
      }

      .og-chips li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 16px 7px 12px;
        border-radius: 999px;
        background: #e6f5ec;
        color: #1d6f48;
        font-size: 21px;
        font-weight: 600;
      }

      .og-chips svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .og-shot {
        position: absolute;
        top: 112px;
        left: 610px;
        width: 700px;
      }
    </style>
  </head>
  <body>
    <div class="og-text">
      <div class="og-brand"><img src="../src/favicon.svg" alt="" />PDF Edit</div>
      <h1>Modifier un PDF sur Mac, simplement</h1>
      <p class="og-sub">Corrigez quelques mots, ou ouvrez-le dans Word ou Pages.</p>
      <ul class="og-chips">
        <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>Gratuit</li>
        <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>Sans inscription</li>
        <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>Vos documents restent chez vous</li>
      </ul>
    </div>
    <div class="frame og-shot"><img src="../src/img/app-2-que-faire.webp" width="1600" height="1047" alt="" /></div>
  </body>
</html>
